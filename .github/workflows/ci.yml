name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ProductHub.slnx
      - name: Build
        run: dotnet build ProductHub.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/ProductHub.UnitTests/ProductHub.UnitTests.csproj --configuration Release --no-build
      - name: SQL Server integration and generation contract tests
        run: dotnet test tests/ProductHub.IntegrationTests/ProductHub.IntegrationTests.csproj --configuration Release --no-build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ProductHub.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ProductHub.Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Comparison tests
        run: npm test
      - name: Install browser for acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile acceptance tests
        run: npm run test:browser
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: .artifacts/browser-results
      - name: Build
        run: npm run build
