name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ProductHub.slnx
      - name: Build
        run: dotnet build ProductHub.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/ProductHub.UnitTests/ProductHub.UnitTests.csproj --configuration Release --no-build
      - name: SQL Server integration and generation contract tests
        run: dotnet test tests/ProductHub.IntegrationTests/ProductHub.IntegrationTests.csproj --configuration Release --no-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline evaluation runner tests
        run: python -m unittest discover -s tests/evaluation -p 'test_*.py'
      - name: Validate evaluation matrix without model calls
        run: python scripts/evaluate.py --dry-run --max-runs 4

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ProductHub.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ProductHub.Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Comparison tests
        run: npm test
      - name: Install browser for acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile acceptance tests
        run: npm run test:browser
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: .artifacts/browser-results
      - name: Build
        run: npm run build
